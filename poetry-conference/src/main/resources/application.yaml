spring:
  redis:
    host: localhost
    port: 6379

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/poetry?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 2345

logging:
  level:
    org.springframework.security: INFO
